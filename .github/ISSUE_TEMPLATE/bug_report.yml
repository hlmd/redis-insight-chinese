name: "🐞 汉化问题 / Bug"
description: 汉化没生效、注入报错、崩溃等问题
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量填全下列信息，越全越好定位。
        提问前可先看 [README](../../blob/master/README.md)。

  - type: dropdown
    id: usage
    attributes:
      label: 使用方式
      options:
        - 下载的二进制
        - Node 源码运行
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows
        - macOS (Intel)
        - macOS (Apple Silicon / M 芯片)
        - Linux
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: 系统版本
      description: 如 Windows 11 23H2、macOS 14.5、Ubuntu 24.04
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: Redis Insight 版本
      description: Redis Insight 内 帮助 → 关于，或安装包版本
      placeholder: 例如 3.8.0
    validations:
      required: true

  - type: input
    id: tool-version
    attributes:
      label: 本工具版本
      description: 所下载 Release 的版本号，或源码的 commit
      placeholder: 例如 v0.1.0
    validations:
      required: true

  - type: textarea
    id: verify
    attributes:
      label: "`verify` 输出"
      description: 运行 `... verify`，把整段输出贴上
      render: text

  - type: textarea
    id: error
    attributes:
      label: 完整报错
      description: 终端的完整错误文本（含 `EBUSY` / `EPERM` 等关键字），别只截一半
      render: text

  - type: textarea
    id: repro
    attributes:
      label: 复现步骤与现象
      description: 做了什么、期望什么、实际什么；界面异常可附截图
      placeholder: |
        1. …
        2. …
        期望：…
        实际：…
    validations:
      required: true
